name: Verify Next.js site

on:
  pull_request:
  push:
    branches: [main, codex/site-cleanup-2026]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - run: npm test
      - run: npm run build
      - run: npm run check
